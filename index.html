<html lang="fr">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>MatchWork — le métier d'abord</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F3F5F1;--ink:#1F2B33;--steel:#2F5266;--sawdust:#E3B23C;--pine:#3E6B4F;--rust:#A6452E;
  --line:#D3D8D0;--card:#FFFFFF;--muted:#56646B;--chip:#E8ECE6;
  --dim1:#2F5266;--dim2:#3E6B4F;--dim3:#A6452E;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#131A1F;--ink:#E7ECEA;--steel:#86AFC5;--sawdust:#E9C25A;--pine:#7DAE8E;--rust:#E2826A;
    --line:#2B3740;--card:#1B242B;--muted:#9EABB1;--chip:#243039;
    --dim1:#86AFC5;--dim2:#7DAE8E;--dim3:#E2826A;
  }
}
:root[data-theme="dark"]{
  --paper:#131A1F;--ink:#E7ECEA;--steel:#86AFC5;--sawdust:#E9C25A;--pine:#7DAE8E;--rust:#E2826A;
  --line:#2B3740;--card:#1B242B;--muted:#9EABB1;--chip:#243039;
  --dim1:#86AFC5;--dim2:#7DAE8E;--dim3:#E2826A;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);
  font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:17px;line-height:1.5}
h1,h2,h3,h4{font-family:"Bricolage Grotesque","Atkinson Hyperlegible",system-ui,sans-serif;line-height:1.12;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sawdust);outline-offset:2px}
.wrap{max-width:600px;margin:0 auto;padding:0 18px 116px}
@media(min-width:900px){.wrap{max-width:640px}}
header.bar{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;max-width:640px;margin:0 auto}
.logo{display:flex;align-items:center;gap:10px;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:1.35rem;letter-spacing:-.01em;background:none;border:0;padding:0;cursor:pointer}
.logo svg{width:30px;height:22px}
.linkbtn{background:none;border:0;color:var(--steel);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:6px 0;font-size:.95rem}

/* ---------- Accueil ---------- */
.hero{padding:26px 0 8px}
.hero h1{font-size:clamp(2.2rem,8.5vw,3.3rem);font-weight:800;letter-spacing:-.025em;max-width:14ch}
.hero p{color:var(--muted);max-width:42ch;margin:16px 0 24px;font-size:1.05rem}
.joint{display:block;width:100%;max-width:340px;height:auto;margin:8px 0 24px}
.choices{display:grid;gap:12px}
@media(min-width:560px){.choices{grid-template-columns:1fr 1fr}}
.bigbtn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:18px 20px;border-radius:14px;border:2px solid var(--ink);background:var(--card);cursor:pointer}
.bigbtn strong{font-family:"Bricolage Grotesque",sans-serif;font-size:1.22rem}
.bigbtn span{color:var(--muted);font-size:.95rem}
.bigbtn.primary{background:var(--steel);border-color:var(--steel);color:#fff}
.bigbtn.primary span{color:rgba(255,255,255,.86)}
.triad{margin:34px 0 0;display:grid;gap:12px}
@media(min-width:560px){.triad{grid-template-columns:repeat(3,1fr)}}
.triad div{border-top:4px solid var(--dim);padding:10px 2px 0}
.triad b{font-family:"Bricolage Grotesque",sans-serif;font-size:1.05rem}
.triad span{display:block;color:var(--muted);font-size:.92rem;margin-top:2px}
.steps{margin:36px 0 0;padding:0;list-style:none;display:grid;gap:16px;counter-reset:s}
.steps li{display:grid;grid-template-columns:34px 1fr;gap:12px;counter-increment:s}
.steps li::before{content:counter(s);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--sawdust);color:#1F2B33;font-weight:700}
.steps b{display:block}
.steps span{color:var(--muted);font-size:.95rem}
.demo-note{margin-top:28px;padding:12px 14px;border-left:4px solid var(--sawdust);background:var(--card);font-size:.9rem;color:var(--muted)}

/* ---------- Liste d'attente (Netlify Forms) ---------- */
.waitlist{margin-top:38px;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:20px}
.waitlist h2{font-size:1.35rem;font-weight:800;margin-bottom:4px}
.waitlist p{color:var(--muted);font-size:.95rem;margin:0 0 14px}
.waitlist form{display:grid;gap:10px}
.waitlist .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hp{position:absolute;left:-9999px;opacity:0;height:0;overflow:hidden}

/* ---------- Formulaires ---------- */
.pagetitle{font-size:1.75rem;font-weight:800;margin:10px 0 6px;letter-spacing:-.015em}
.lead{color:var(--muted);margin:0 0 18px}
form.pf{display:grid;gap:18px}
label.f{display:grid;gap:6px;font-weight:700;font-size:.95rem}
label.f small{font-weight:400;color:var(--muted)}
input[type=text],input[type=number],input[type=email],select,textarea{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--card)}
textarea{min-height:74px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
fieldset{border:0;padding:0;margin:0}
fieldset.dim{border-left:4px solid var(--dim);padding-left:12px}
legend{font-weight:700;font-size:1rem;font-family:"Bricolage Grotesque",sans-serif;margin-bottom:2px}
.dimhint{color:var(--muted);font-size:.9rem;margin:0 0 8px}
.private{border:1.5px dashed var(--line);border-radius:12px;padding:14px;display:grid;gap:12px}
.private-h{display:flex;align-items:center;gap:8px;font-size:.9rem;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:7px 13px;cursor:pointer;font-size:.92rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.addchip{display:flex;gap:8px;margin-top:8px}
.addchip input{flex:1;padding:8px 12px}
.addchip button{padding:8px 14px;border-radius:10px;border:1.5px solid var(--steel);background:none;color:var(--steel);font-weight:700;cursor:pointer}
.submit{padding:15px;border-radius:12px;border:0;background:var(--steel);color:#fff;font-weight:700;font-size:1.05rem;cursor:pointer}
.ghost{padding:10px 16px;border-radius:10px;border:1.5px solid var(--steel);background:none;color:var(--steel);font-weight:700;cursor:pointer}
.toolrow{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}

/* ---------- Cartes ---------- */
.deck{position:relative;height:min(600px,calc(100dvh - 300px));min-height:460px;margin-top:6px}
.card{position:absolute;inset:0;background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:22px 20px;overflow:auto;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.card.top{cursor:grab;z-index:2}
.card.under{transform:scale(.96) translateY(12px);opacity:.7;z-index:1}
.card.fly{transition:transform .35s ease,opacity .35s ease}
.card .code{font-family:"Bricolage Grotesque",sans-serif;font-size:.9rem;color:var(--muted)}
.card h2{font-size:1.6rem;font-weight:800;margin:4px 0 8px;letter-spacing:-.015em}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--muted);font-size:.95rem;margin-bottom:12px}
.fitbox{display:grid;gap:7px;margin:0 0 14px;padding:12px;border-radius:12px;background:var(--chip)}
.fitbox .frow{display:grid;grid-template-columns:96px 1fr 44px;align-items:center;gap:10px;font-size:.88rem}
.fitbox .gauge{height:7px;background:var(--card);border-radius:4px;overflow:hidden}
.fitbox .gauge i{display:block;height:100%;background:var(--dim)}
.fitbox .tot{font-weight:700;font-size:.95rem;display:flex;justify-content:space-between;border-top:1.5px solid var(--line);padding-top:7px;margin-top:2px}
.card h3{font-size:1rem;margin:14px 0 6px;display:flex;align-items:center;gap:8px}
.card h3::before{content:"";width:10px;height:10px;border-radius:2px;background:var(--dim,var(--sawdust))}
.tag{display:inline-block;padding:4px 10px;border-radius:6px;background:var(--chip);margin:0 6px 6px 0;font-size:.9rem}
.tag.hit{background:var(--pine);color:#fff}
.quote{margin:0;padding-left:12px;border-left:3px solid var(--sawdust)}
.masked{margin-top:16px;display:flex;gap:8px;align-items:flex-start;font-size:.88rem;color:var(--muted)}
.stamp{position:absolute;top:22px;padding:6px 12px;border:3px solid;border-radius:8px;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:1.2rem;opacity:0;pointer-events:none;background:var(--card)}
.stamp.yes{right:18px;color:var(--pine);transform:rotate(8deg)}
.stamp.no{left:18px;color:var(--rust);transform:rotate(-8deg)}
.actions{display:flex;justify-content:center;gap:18px;margin-top:18px}
.act{display:flex;align-items:center;gap:8px;padding:13px 22px;border-radius:999px;border:2px solid var(--ink);background:var(--card);font-weight:700;cursor:pointer}
.act.yes{background:var(--pine);border-color:var(--pine);color:#fff}
.hint{text-align:center;color:var(--muted);font-size:.85rem;margin-top:10px}
.empty{text-align:center;padding:60px 10px;color:var(--muted)}
.empty h2{color:var(--ink);font-size:1.4rem;margin-bottom:8px}

/* ---------- Matchs & messages ---------- */
.match{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.match h3{font-size:1.2rem;margin-bottom:4px}
.reveal{margin-top:12px;padding:12px;border-radius:10px;background:var(--chip);display:grid;gap:3px;font-size:.95rem}
.reveal b{font-family:"Bricolage Grotesque",sans-serif}
.small{font-size:.88rem;color:var(--muted)}
.thread{margin-top:12px;display:grid;gap:8px}
.msg{max-width:85%;padding:9px 13px;border-radius:12px;font-size:.95rem}
.msg.me{justify-self:end;background:var(--steel);color:#fff;border-bottom-right-radius:4px}
.msg.them{justify-self:start;background:var(--chip);border-bottom-left-radius:4px}
.msgform{display:flex;gap:8px;margin-top:10px}
.msgform input{flex:1}
.msgform button{padding:0 18px;border-radius:10px;border:0;background:var(--steel);color:#fff;font-weight:700;cursor:pointer}

/* ---------- Navigation basse ---------- */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1.5px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
nav.tabs>div{display:flex;max-width:640px;margin:0 auto}
nav.tabs button{flex:1;background:none;border:0;padding:12px 4px 14px;font-weight:700;font-size:.92rem;color:var(--muted);cursor:pointer;position:relative}
nav.tabs button[aria-current="page"]{color:var(--ink)}
nav.tabs button[aria-current="page"]::after{content:"";position:absolute;top:0;left:25%;right:25%;height:3px;background:var(--sawdust);border-radius:0 0 3px 3px}
.badge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--rust);color:#fff;font-size:.75rem;margin-left:4px}

/* ---------- Modale & toast ---------- */
.modal{position:fixed;inset:0;background:rgba(15,22,27,.72);display:grid;place-items:center;padding:20px;z-index:50}
.modal .box{background:var(--card);border-radius:18px;padding:26px 22px;max-width:400px;width:100%;text-align:center}
.modal h2{font-size:1.9rem;font-weight:800;margin:6px 0 8px}
.modal p{color:var(--muted);margin:0 0 18px}
.fit{width:220px;height:90px;display:block;margin:0 auto}
.fit .left{animation:slide 1s cubic-bezier(.2,.8,.2,1) .15s both}
@keyframes slide{from{transform:translateX(-46px)}to{transform:translateX(0)}}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-size:.92rem;z-index:60;max-width:90vw;text-align:center}
@media (prefers-reduced-motion: reduce){.fit .left{animation:none}.card.fly{transition:none}}
</style>
</head>

const KEY="matchwork-v1";
let S=load(),view=S.role?"deck":"home";
function fresh(){return{role:null,cand:null,ent:null,decided:{cand:[],ent:[]},matches:{cand:[],ent:[]},seen:{cand:0,ent:0},threads:{}}}
function load(){try{const v=localStorage.getItem(KEY);if(v)return Object.assign(fresh(),JSON.parse(v))}catch(e){}return fresh()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function code(id){let h=0;for(const c of id+"tenon")h=(h*31+c.charCodeAt(0))>>>0;const a="ABCDEFGHJKMNPQRSTUVWXYZ23456789";let r="";for(let i=0;i<4;i++){r+=a[h%a.length];h=Math.floor(h/a.length)+i*7}return r}

/* ================= Score par dimension ================= */
function dimScore(have,want){if(!want||!want.length)return null;const h=new Set(have||[]);return Math.round(100*want.filter(s=>h.has(s)).length/want.length)}
function fitDetail(profil,attentes){
  let tot=0,pd=0;const det={};
  for(const[k]of DIMS){const s=dimScore(profil[k],attentes[k]);det[k]=s;if(s!==null){tot+=s*POIDS[k];pd+=POIDS[k]}}
  det.total=pd?Math.round(tot/pd):0;return det;
}

const app=document.getElementById("app"),tabs=document.getElementById("tabs"),sw=document.getElementById("switch");
function render(){
  tabs.hidden=!S.role||view==="home"||view==="setup";
  sw.hidden=!S.role||view==="home";
  tabs.querySelectorAll("button").forEach(b=>{
    b.setAttribute("aria-current",b.dataset.v===view?"page":"false");
    if(b.dataset.v==="matches"){const n=S.role?S.matches[S.role].length-S.seen[S.role]:0;
      b.innerHTML="Matchs"+(n>0&&view!=="matches"?`<span class="badge">${n}</span>`:"")}
  });
  if(view==="home")home();
  else if(view==="setup"||view==="profile")setup();
  else if(view==="deck")deck();
  else if(view==="matches")matches();
}

/* ---------- Cartes ---------- */
function fitBox(det,label){
  return `<div class="fitbox">${DIMS.map(([k,n,c])=>det[k]===null?"":`<div class="frow" style="--dim:${c}"><span>${n}</span><div class="gauge"><i style="width:${det[k]}%"></i></div><span>${det[k]} %</span></div>`).join("")}

function tags(list,want){const w=new Set(want||[]);return (list||[]).map(s=>`<span class="tag ${w.has(s)?"hit":""}">${esc(s)}</span>`).join("")||'<span class="small">—</span>'}
function dimBlock(k,n,c,list,want){return `<h3 style="--dim:${c}">${n}</h3><div>${tags(list,want)}</div>`}

function candCard(c,att,static_){

    ${static_?"":fitBox(det,"Compatibilité avec l'offre")}
    ${DIMS.map(([k,n,col])=>dimBlock(k,n,col,c[k],att[k])).join("")}
    ${c.moteurs?.length?`<h3 style="--dim:var(--sawdust)">Ce qui le fait avancer</h3><div>${c.moteurs.map(m=>`<span class="tag">${esc(m)}</span>`).join("")}</div>`:""}

    ${c.bienfait?`<h3 style="--dim:var(--sawdust)">Le travail bien fait, pour lui</h3><p class="quote">${esc(c.bienfait)}</p>`:""}

  </article>`}

function offerCard(o,me){
  const det=fitDetail(me,o);
  return `<article class="card top" data-id="${o.id}">

    <div class="code">${esc(o.ent)}, ${esc(o.taille||"")}</div>

    ${o.valeurs?`<h3 style="--dim:var(--sawdust)">Le travail bien fait, chez eux</h3><p class="quote">${esc(o.valeurs)}</p>`:""}
    ${o.offre?`<h3 style="--dim:var(--sawdust)">Ce qu'ils offrent</h3><p class="quote">${esc(o.offre)}</p>`:""}

  </article>`}

function pool(){
  const r=S.role,done=new Set(S.decided[r]);
  if(r==="cand")return OFFERS.filter(o=>!done.has(o.id)).map(o=>({o,s:fitDetail(S.cand,o).total})).sort((a,b)=>b.s-a.s).map(x=>x.o);
  return CANDS.filter(c=>!done.has(c.id)).map(c=>({c,s:fitDetail(c,S.ent).total})).sort((a,b)=>b.s-a.s).map(x=>x.c);
}

    document.getElementById("rs").onclick=()=>{const m=new Set(S.matches[r].map(x=>x.id));S.decided[r]=S.decided[r].filter(id=>m.has(id));save();render()};
    return;
  }
  const top=list[0],next=list[1];
  const mk=x=>r==="cand"?offerCard(x,S.cand):candCard(x,S.ent);
  app.innerHTML=`<p class="lead" style="margin:4px 0 8px">${r==="cand"?`${list.length} offre${list.length>1?"s":""} autour de ${esc(S.cand.ville)}`:`${list.length} profil${list.length>1?"s":""} pour « ${esc(S.ent.poste)} »`}</p>
  <div class="deck">${next?mk(next).replace('class="card top"','class="card under" aria-hidden="true"'):""}${mk(top)}</div>
  <div class="actions"><button class="act" id="no">Passer</button><button class="act yes" id="yes">Intéressé</button></div>
  <p class="hint">Glisse la carte ou utilise les flèches du clavier.</p>`;
  const card=app.querySelector(".card.top");
  const yes=card.querySelector(".stamp.yes"),no=card.querySelector(".stamp.no");
  let x0=null,dx=0;
  card.addEventListener("pointerdown",e=>{x0=e.clientX;dx=0;card.setPointerCapture(e.pointerId);card.style.cursor="grabbing"});
  card.addEventListener("pointermove",e=>{if(x0===null)return;dx=e.clientX-x0;card.style.transform=`translateX(${dx}px) rotate(${dx/22}deg)`;
    yes.style.opacity=Math.max(0,Math.min(1,dx/90));no.style.opacity=Math.max(0,Math.min(1,-dx/90))});
  const end=()=>{if(x0===null)return;x0=null;card.style.cursor="";
    if(Math.abs(dx)>100)fling(card,top.id,dx>0);
    else{card.classList.add("fly");card.style.transform="";yes.style.opacity=0;no.style.opacity=0;setTimeout(()=>card.classList.remove("fly"),350)}};
  card.addEventListener("pointerup",end);card.addEventListener("pointercancel",end);
  document.getElementById("yes").onclick=()=>fling(card,top.id,true);
  document.getElementById("no").onclick=()=>fling(card,top.id,false);
}
function fling(card,id,like){
  card.classList.add("fly");
  card.style.transform=`translateX(${like?600:-600}px) rotate(${like?25:-25}deg)`;card.style.opacity=0;
  setTimeout(()=>decide(id,like),260);
}
function decide(id,like){
  const r=S.role;S.decided[r].push(id);let matched=null;
  if(like){
    if(r==="cand"){const o=OFFERS.find(x=>x.id===id);if(fitDetail(S.cand,o).total>=45)matched=o}
    else{const c=CANDS.find(x=>x.id===id);
      const ok=fitDetail(c,S.ent).total>=40&&(c.contrat==="Indifférent"||!S.ent.contrat||c.contrat===S.ent.contrat);
      if(ok)matched=c}
    if(matched)S.matches[r].unshift({id,at:Date.now()});
  }
  save();render();
  if(matched)showMatch(matched);
}
function showMatch(x){
  const isC=S.role==="cand";
  const m=document.createElement("div");m.className="modal";m.setAttribute("role","dialog");m.setAttribute("aria-modal","true");
  m.innerHTML=`<div class="box">${jointSvg("fit")}<h2>Ça s'emboîte</h2>
  <p>${isC?`${esc(x.ent)} s'intéresse aussi à ton profil. Ils découvrent maintenant ton nom.`:`Le profil ${code(x.id)} est intéressé par ton offre. Son identité est maintenant visible.`}</p>
  <button class="submit" id="see" style="width:100%">Voir le match</button>
  <button class="linkbtn" id="cont" style="margin-top:8px">Continuer à découvrir</button></div>`;
  document.body.appendChild(m);
  const close=()=>m.remove();
  m.querySelector("#see").onclick=()=>{close();view="matches";render()};
  m.querySelector("#cont").onclick=close;
  m.querySelector("#see").focus();
}

/* ---------- Matchs + messagerie ---------- */
const REPLIES={cand:["Bonjour, merci pour votre intérêt ! Quand seriez-vous disponible pour passer nous voir à l'atelier ?","Vos réponses nous plaisent. On vous propose une visite du poste avant tout entretien formel, ça vous va ?"],
  ent:["Bonjour, merci pour votre message. Je peux passer vous rencontrer en fin de semaine si ça vous arrange.","Volontiers ! Je préfère commencer par voir le poste en vrai, on discute mieux sur place."]};
function threadKey(id){return S.role+"|"+id}
function matches(){
  const r=S.role,list=S.matches[r];S.seen[r]=list.length;save();
  if(!list.length){app.innerHTML=`<div class="empty"><h2>Pas encore de match</h2><p>Un match apparaît quand l'intérêt est réciproque. Continue à découvrir ${r==="cand"?"les offres":"les profils"}.</p><button class="ghost" id="go">Découvrir</button></div>`;
    document.getElementById("go").onclick=()=>{view="deck";render()};return}
  app.innerHTML=`<h1 class="pagetitle">Mes matchs</h1><p class="lead">L'intérêt est réciproque : identités dévoilées, discussion ouverte.</p>`+
  list.map(({id})=>{
    const th=S.threads[threadKey(id)]||[];
    const msgs=th.map(m=>`<div class="msg ${m.me?"me":"them"}">${esc(m.t)}</div>`).join("");
    let head;
    if(r==="cand"){const o=OFFERS.find(x=>x.id===id);
      head=`<h3>${esc(o.poste)}</h3><div class="small">${esc(o.ent)}, ${esc(o.ville)}, ${esc(o.contrat)}</div>
      <div class="reveal"><b>Contact</b><span>${esc(o.contact)}</span></div>`}
    else{const c=CANDS.find(x=>x.id===id);
      head=`<h3>${esc(c.metier)}</h3><div class="small">Profil ${code(c.id)}, ${esc(c.exp)} ans de métier</div>
      <div class="reveal"><b>${esc(c.nom)}, ${esc(c.age)} ans</b><span>${esc(c.ville)}, ${esc(c.tel)}</span></div>`}
    return `<div class="match" data-id="${id}">${head}
      <div class="thread">${msgs}</div>
      <form class="msgform"><input type="text" placeholder="Écrire un message…" aria-label="Message" maxlength="300"><button>Envoyer</button></form>
    </div>`}).join("")+
  `<button class="linkbtn" id="reset" style="margin-top:20px">Recommencer la démo depuis zéro</button>`;
  app.querySelectorAll(".match").forEach(el=>{
    el.querySelector(".msgform").onsubmit=e=>{
      e.preventDefault();const inp=e.target.querySelector("input"),t=inp.value.trim();if(!t)return;
      const k=threadKey(el.dataset.id);S.threads[k]=S.threads[k]||[];S.threads[k].push({me:1,t});save();inp.value="";
      const th=el.querySelector(".thread");th.insertAdjacentHTML("beforeend",`<div class="msg me">${esc(t)}</div>`);
      const nb=S.threads[k].filter(m=>!m.me).length;
      if(nb<2)setTimeout(()=>{const rep=REPLIES[S.role][nb]||REPLIES[S.role][0];S.threads[k].push({me:0,t:rep});save();
        th.insertAdjacentHTML("beforeend",`<div class="msg them">${esc(rep)}</div>`)},900);
    };
  });
  document.getElementById("reset").onclick=()=>{if(confirm("Effacer profils, choix, matchs et messages de la démo ?")){S=fresh();save();view="home";render()}};
}

/* ---------- Divers ---------- */
function toast(t){const d=document.createElement("div");d.className="toast";d.setAttribute("role","status");d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),3200)}
tabs.querySelectorAll("button").forEach(b=>b.onclick=()=>{view=b.dataset.v;render();scrollTo(0,0)});
document.getElementById("logo").onclick=()=>{view="home";render()};
sw.onclick=()=>{S.role=S.role==="cand"?"ent":"cand";save();view=S[S.role]?"deck":"setup";render();toast(S.role==="cand"?"Côté candidat":"Côté recruteur")};
document.addEventListener("keydown",e=>{
  if(view!=="deck"||document.querySelector(".modal")||/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName))return;
  if(e.key==="ArrowRight")document.getElementById("yes")?.click();
  if(e.key==="ArrowLeft")document.getElementById("no")?.click();
});
render();
</script>
