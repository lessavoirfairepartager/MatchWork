<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#013B79">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<meta property="og:title" content="MatchWork — le métier d'abord">
<meta property="og:description" content="Matching emploi anonymisé : savoirs, savoir-faire, savoir-être. L'identité se dévoile au match.">
<meta property="og:image" content="logo.png">
<meta property="og:type" content="website">
<meta name="description" content="MatchWork — matching emploi anonymisé : savoirs, savoir-faire, savoir-être. Le métier d'abord, l'identité après le match.">
<title>MatchWork — le métier d'abord</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script>(function(){try{var t=localStorage.getItem('mw-theme')||'auto';if(t!=='auto')document.documentElement.setAttribute('data-theme',t);
var z=parseInt(localStorage.getItem('mw-zoom')||'17',10);if(z)document.documentElement.style.fontSize=z+'px';
if(localStorage.getItem('mw-dys')==='1')document.addEventListener('DOMContentLoaded',function(){document.body.classList.add('dys')});}catch(e){}})();</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="bar">
  <button class="logo" id="logo" aria-label="Accueil">
    <img src="logo-mark.svg" alt="" width="34" height="19"><span>Match<span class="o">Work</span></span>
  </button>
  <button class="linkbtn" id="logout" hidden>Se déconnecter</button>
</header>
<main class="wrap" id="app"><p class="lead" style="padding:40px 0">Chargement…</p></main>
<nav class="tabs" id="tabs" hidden><div>
  <button data-v="deck">Découvrir</button>
  <button data-v="matches">Matchs</button>
  <button data-v="profile">Profil</button>
</div></nav>
<footer class="foot">
  <a href="mentions-legales.html">Mentions légales</a> ·
  <a href="confidentialite.html">Confidentialité</a>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
"use strict";

/* ===================== Référentiels ===================== */
const SAVOIRS=["Lecture de plans","Normes de sécurité","Habilitation électrique","Schémas électriques","Réglementation transport","Gestion des stocks","Comptabilité générale","HACCP / hygiène","Métrologie","DTU / normes bâtiment","Bureautique","Anglais technique"];
const SF=["Soudure TIG","Usinage CN","Maintenance préventive","Dépannage électrique","Automatismes API","Plomberie","Chauffage / PAC","Menuiserie / agencement","Conduite PL","CACES 3","Cuisine collective","Service en salle","Aide à la personne","Gestion d'équipe","Relation client","Tableur / Excel"];
/* Savoir-être et moteurs : curseurs de 0 à 10 */
const SE=[
 ["fiabilite","Fiabilité","Faire ce qu'on a dit, dans les délais"],
 ["autonomie","Autonomie","Avancer sans qu'on repasse derrière"],
 ["equipe","Esprit d'équipe","Tirer avec les autres, pas tout seul"],
 ["calme","Calme sous pression","Garder la tête froide dans le coup de feu"],
 ["transmission","Transmission","Expliquer, former, montrer le geste"],
 ["rigueur","Rigueur","Le détail qui fait la qualité"],
 ["adaptabilite","Adaptabilité","Changer de poste ou de méthode sans râler"],
 ["service","Sens du service","Le client ou le collègue d'abord"]
];
const MOT=[
 ["transmettre","Transmettre ce que je sais",""],
 ["apprendre","Continuer d'apprendre",""],
 ["concret","Voir le résultat concret",""],
 ["collectif","Travailler en équipe",""],
 ["liberte","Être autonome dans mon travail",""],
 ["defi","Relever des défis",""],
 ["stabilite","Stabilité et sérénité",""],
 ["proximite","Travailler près de chez moi",""]
];
const MOT_ENT="Ce que ce poste offre vraiment, sans enjoliver.";
const CONTRATS=["CDI","CDD","Temps partiel","Intérim","Indifférent"];
const DIMS=[["savoirs","Savoirs","var(--dim1)"],["sf","Savoir-faire","var(--dim2)"]];
const POIDS={savoirs:.25,sf:.35,se:.25,moteurs:.15};
const CGU="1.0";

/* ===================== État ===================== */
let sb=null,session=null,me=null,mine=null,myOffer=null,view="landing",busy=false;
const app=document.getElementById("app"),tabs=document.getElementById("tabs"),lo=document.getElementById("logout");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const code=id=>{let h=0;for(const c of String(id))h=(h*31+c.charCodeAt(0))>>>0;const a="ABCDEFGHJKMNPQRSTUVWXYZ23456789";let r="";for(let i=0;i<4;i++){r+=a[h%a.length];h=Math.floor(h/a.length)+i*7}return r};
function toast(t){const d=document.createElement("div");d.className="toast";d.setAttribute("role","status");d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),3600)}

/* ===================== Score ===================== */
function setScore(have,want){if(!want||!want.length)return null;const h=new Set(have||[]);return Math.round(100*want.filter(x=>h.has(x)).length/want.length)}
function curScore(have,want){ /* pénalise seulement ce qui manque par rapport à l'attente */
  if(!want)return null;let tot=0,man=0;
  for(const k in want){const w=Number(want[k])||0;if(w<=0)continue;tot+=w;man+=Math.max(0,w-(Number(have?.[k])||0))}
  return tot?Math.round(100*(1-man/tot)):null}
function fit(c,o){
  const d={savoirs:setScore(c.savoirs,o.savoirs),sf:setScore(c.sf,o.sf),se:curScore(c.se,o.se),moteurs:curScore(o.moteurs,c.moteurs)};
  let s=0,p=0;for(const k in POIDS){if(d[k]!==null){s+=d[k]*POIDS[k];p+=POIDS[k]}}
  d.total=p?Math.round(s/p):0;return d}

/* ===================== Démarrage ===================== */
function boot(){
  if(!window.MW_CONFIG||!MW_CONFIG.url||MW_CONFIG.url.includes("VOTRE")){
    app.innerHTML=`<h1 class="pagetitle">Configuration à terminer</h1>
    <p class="lead">Ouvre le fichier <code>config.js</code> et renseigne l'URL de ton projet Supabase et la clé publique <code>anon</code>. Le fichier <code>supabase/schema.sql</code> est à exécuter une fois dans l'éditeur SQL de Supabase.</p>`;return}
  sb=window.supabase.createClient(MW_CONFIG.url,MW_CONFIG.key);
  sb.auth.onAuthStateChange((_e,s)=>{session=s;refresh()});
  sb.auth.getSession().then(({data})=>{session=data.session;refresh()});
}
async function refresh(){
  if(!session){me=null;mine=null;myOffer=null;view="landing";return render()}
  const {data:p}=await sb.from("profiles").select("*").eq("id",session.user.id).maybeSingle();
  me=p||null;
  if(!me){view="role";return render()}
  sb.from("profiles").update({last_seen:new Date().toISOString()}).eq("id",me.id).then(()=>{});
  if(me.role==="cand"){
    const [{data:pub},{data:priv}]=await Promise.all([
      sb.from("cand_public").select("*").eq("id",me.id).maybeSingle(),
      sb.from("cand_private").select("*").eq("id",me.id).maybeSingle()]);
    mine=pub?{...pub,...(priv||{})}:null;
    if(!mine){view="setup"}else if(!["deck","matches","profile"].includes(view))view="deck";
  }else{
    const {data:o}=await sb.from("offers").select("*").eq("owner",me.id).order("updated_at",{ascending:false}).limit(1);
    myOffer=o&&o[0]?o[0]:null;
    if(myOffer){const {data:op}=await sb.from("offer_private").select("*").eq("offer_id",myOffer.id).maybeSingle();myOffer.contact=op?.contact||""}
    if(!myOffer){view="setup"}else if(!["deck","matches","profile"].includes(view))view="deck";
  }
  render();
}
function render(){
  const logged=!!session&&!!me&&(mine||myOffer);
  tabs.hidden=!logged||view==="setup";
  lo.hidden=!session;
  tabs.querySelectorAll("button").forEach(b=>b.setAttribute("aria-current",b.dataset.v===view?"page":"false"));
  if(view==="landing")landing();
  else if(view==="role")roleView();
  else if(view==="setup"||view==="profile")setup();
  else if(view==="deck")deck();
  else if(view==="matches")matches();
}

/* ===================== Accueil et compte ===================== */
function jointSvg(cls){return `<img src="logo.svg" class="${cls}" alt="MatchWork">`}
function lockIcon(){return `<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="7" width="10" height="8" rx="1.5" fill="currentColor"/><path d="M5 7V5a3 3 0 0 1 6 0v2" stroke="currentColor" stroke-width="1.6" fill="none"/></svg>`}

function landing(){
  app.innerHTML=`<section class="hero">
    <h1>Le métier d'abord. Le reste après le match.</h1>
    <p>Un profil raconte ici ce qu'on sait, ce qu'on sait faire et comment on est au travail. Nom, âge et coordonnées restent dans une zone protégée du serveur tant que l'intérêt n'est pas réciproque.</p>
    ${jointSvg("joint")}
    <div class="triad">
      <div style="--dim:var(--dim1)"><b>Savoirs</b><span>Normes, plans, habilitations, réglementation.</span></div>
      <div style="--dim:var(--dim2)"><b>Savoir-faire</b><span>Les gestes du métier, acquis sur le terrain.</span></div>
      <div style="--dim:var(--dim3)"><b>Savoir-être</b><span>Huit curseurs de 0 à 10, pour nuancer au lieu de cocher.</span></div>
    </div>
    <div class="authbox">
      <div class="segmented" role="tablist">
        <button id="tIn" role="tab" aria-selected="true">Se connecter</button>
        <button id="tUp" role="tab" aria-selected="false">Créer un compte</button>
      </div>
      <form class="pf" id="auth">
        <label class="f">Adresse e-mail<input type="email" name="email" required autocomplete="email"></label>
        <label class="f">Mot de passe<input type="password" name="password" required minlength="8" autocomplete="current-password"><small>8 caractères minimum.</small></label>
        <label class="check" id="consentWrap" hidden><input type="checkbox" name="consent"><span>J'ai lu et j'accepte la <a href="confidentialite.html" target="_blank" rel="noopener">politique de confidentialité</a>. J'autorise MatchWork à enregistrer les informations que je saisis pour me mettre en relation.</span></label>
        <button class="submit" id="authBtn">Se connecter</button>
      </form>
      <p class="small" style="margin-top:10px">Aucune donnée sensible ne doit être saisie : ni santé, ni origine, ni opinion, ni situation familiale.</p>
    </div>
  </section>`;
  let mode="in";
  const setMode=m=>{mode=m;
    document.getElementById("tIn").setAttribute("aria-selected",m==="in");
    document.getElementById("tUp").setAttribute("aria-selected",m==="up");
    document.getElementById("consentWrap").hidden=m!=="up";
    document.getElementById("authBtn").textContent=m==="in"?"Se connecter":"Créer mon compte";
    app.querySelector('[name="password"]').setAttribute("autocomplete",m==="in"?"current-password":"new-password")};
  document.getElementById("tIn").onclick=()=>setMode("in");
  document.getElementById("tUp").onclick=()=>setMode("up");
  document.getElementById("auth").onsubmit=async e=>{
    e.preventDefault();if(busy)return;busy=true;
    const f=Object.fromEntries(new FormData(e.target));
    try{
      if(mode==="up"){
        if(!f.consent){toast("Il faut accepter la politique de confidentialité.");return}
        const {data,error}=await sb.auth.signUp({email:f.email,password:f.password});
        if(error)throw error;
        if(!data.session)toast("Compte créé : confirme ton adresse par e-mail, puis connecte-toi.");
      }else{
        const {error}=await sb.auth.signInWithPassword({email:f.email,password:f.password});
        if(error)throw error;
      }
    }catch(err){toast(err.message||"Connexion impossible.")}finally{busy=false}
  };
}

function roleView(){
  app.innerHTML=`<h1 class="pagetitle">De quel côté es-tu ?</h1>
  <p class="lead">Ce choix détermine ce que tu verras. Il reste modifiable en supprimant puis recréant ton profil.</p>
  <div class="choices">
    <button class="bigbtn primary" data-r="cand"><strong>Je cherche un poste</strong><span>Mon expérience parle avant mon état civil</span></button>
    <button class="bigbtn" data-r="ent"><strong>Je recrute</strong><span>Je découvre des parcours, pas des âges</span></button>
  </div>`;
  app.querySelectorAll("[data-r]").forEach(b=>b.onclick=async()=>{
    if(busy)return;busy=true;
    const {error}=await sb.from("profiles").insert({id:session.user.id,role:b.dataset.r,cgu_version:CGU});
    busy=false;
    if(error)return toast(error.message);
    view="setup";refresh();
  });
}

/* ===================== Formulaires ===================== */
function chips(list,sel,name){return `<div class="chips" data-g="${name}">${list.map(s=>`<button type="button" class="chip" aria-pressed="${(sel||[]).includes(s)}" data-s="${esc(s)}">${esc(s)}</button>`).join("")}</div>
  <div class="addchip"><input type="text" placeholder="Ajouter le tien…" aria-label="Ajouter un élément"><button type="button">Ajouter</button></div>`}
function sliders(list,vals,name,hint){
  return `<div class="sliders" data-g="${name}">${hint?`<p class="dimhint">${hint}</p>`:""}
  ${list.map(([k,label,sub])=>{const v=Number(vals?.[k] ?? 5);
    return `<div class="sl"><div class="sl-h"><label for="${name}_${k}">${esc(label)}</label><output id="o_${name}_${k}">${v}</output></div>
    <input type="range" id="${name}_${k}" data-k="${k}" min="0" max="10" step="1" value="${v}" aria-describedby="${sub?`d_${name}_${k}`:""}">
    ${sub?`<span class="sl-s" id="d_${name}_${k}">${esc(sub)}</span>`:""}</div>`}).join("")}</div>`}
function opts(list,v){return list.map(o=>`<option ${o===v?"selected":""}>${esc(o)}</option>`).join("")}

function setup(){
  const isC=me.role==="cand",d=isC?(mine||{}):(myOffer||{});
  const first=isC?!mine:!myOffer;
  app.innerHTML=isC?`
  <h1 class="pagetitle">${first?"Créer mon profil":"Mon profil"}</h1>
  <p class="lead">Les recruteurs voient le métier, l'expérience et les trois dimensions. Le nom, l'âge et le téléphone restent stockés à part et ne sortent qu'au match.</p>
  <form class="pf" id="f">
    <label class="f">Métier ou poste recherché<input type="text" name="metier" required value="${esc(d.metier||"")}"></label>
    <div class="row2">
      <label class="f">Années de métier<input type="number" name="exp" min="0" max="60" required value="${esc(d.exp??0)}"></label>
      <label class="f">Contrat souhaité<select name="contrat">${opts(CONTRATS,d.contrat||"CDI")}</select></label>
    </div>
    <div class="row2">
      <label class="f">Ville<input type="text" name="ville" value="${esc(d.ville||"")}"></label>
      <label class="f">Mobilité (km)<input type="number" name="mobilite" min="0" max="300" value="${esc(d.mobilite??30)}"></label>
    </div>
    <fieldset class="dim" style="--dim:var(--dim1)"><legend>Savoirs</legend><p class="dimhint">Ce que tu connais : normes, plans, habilitations…</p>${chips(SAVOIRS,d.savoirs,"savoirs")}</fieldset>
    <fieldset class="dim" style="--dim:var(--dim2)"><legend>Savoir-faire</legend><p class="dimhint">Les gestes de ton métier.</p>${chips(SF,d.sf,"sf")}</fieldset>
    <fieldset class="dim" style="--dim:var(--dim3)"><legend>Savoir-être au travail</legend>${sliders(SE,d.se,"se","Place chaque curseur où tu te situes vraiment. Tout à 10 ne dit rien de toi.")}</fieldset>
    <fieldset class="dim" style="--dim:var(--sawdust)"><legend>Ce qui me fait avancer</legend>${sliders(MOT,d.moteurs,"moteurs","À quel point chaque chose compte pour toi dans un poste.")}</fieldset>
    <label class="f">Une réalisation dont tu es fier<small>Une phrase concrète vaut mieux qu'un CV entier.</small><textarea name="fierte" maxlength="400">${esc(d.fierte||"")}</textarea></label>
    <label class="f">Pour toi, un travail bien fait c'est…<textarea name="bienfait" maxlength="400">${esc(d.bienfait||"")}</textarea></label>
    <div class="private">
      <div class="private-h">${lockIcon()} Zone protégée — transmise uniquement en cas de match</div>
      <div class="row2">
        <label class="f">Nom<input type="text" name="nom" value="${esc(d.nom||"")}"></label>
        <label class="f">Âge<input type="number" name="age" min="16" max="99" value="${esc(d.age??"")}"></label>
      </div>
      <label class="f">Téléphone ou e-mail de contact<input type="text" name="tel" value="${esc(d.tel||"")}"></label>
    </div>
    <button class="submit">${first?"Enregistrer et découvrir les offres":"Enregistrer les modifications"}</button>
  </form>`:`
  <h1 class="pagetitle">${first?"Publier une offre":"Mon offre"}</h1>
  <p class="lead">Décris le poste par les dimensions attendues. Les candidats te sont présentés sans nom, âge ni coordonnées.</p>
  <form class="pf" id="f">
    <div class="row2">
      <label class="f">Entreprise<input type="text" name="ent" required value="${esc(d.ent||"")}"></label>
      <label class="f">Taille<input type="text" name="taille" placeholder="12 salariés" value="${esc(d.taille||"")}"></label>
    </div>
    <label class="f">Poste<input type="text" name="poste" required value="${esc(d.poste||"")}"></label>
    <div class="row2">
      <label class="f">Ville<input type="text" name="ville" value="${esc(d.ville||"")}"></label>
      <label class="f">Contrat<select name="contrat">${opts(CONTRATS.slice(0,4),d.contrat||"CDI")}</select></label>
    </div>
    <label class="f">Rémunération<input type="text" name="salaire" value="${esc(d.salaire||"")}"></label>
    <fieldset class="dim" style="--dim:var(--dim1)"><legend>Savoirs attendus</legend>${chips(SAVOIRS,d.savoirs,"savoirs")}</fieldset>
    <fieldset class="dim" style="--dim:var(--dim2)"><legend>Savoir-faire attendus</legend>${chips(SF,d.sf,"sf")}</fieldset>
    <fieldset class="dim" style="--dim:var(--dim3)"><legend>Savoir-être recherchés</legend>${sliders(SE,d.se,"se","Le niveau d'exigence du poste, pas l'idéal absolu. Tout à 10 ne filtre plus rien.")}</fieldset>
    <fieldset class="dim" style="--dim:var(--sawdust)"><legend>Ce que le poste offre</legend>${sliders(MOT,d.moteurs,"moteurs",MOT_ENT)}</fieldset>
    <label class="f">Le travail bien fait, chez vous<textarea name="valeurs" maxlength="400">${esc(d.valeurs||"")}</textarea></label>
    <label class="f">Ce que vous offrez<small>Conditions, ambiance, perspectives.</small><textarea name="plus" maxlength="400">${esc(d.plus||"")}</textarea></label>
    <div class="private">
      <div class="private-h">${lockIcon()} Zone protégée — transmise uniquement en cas de match</div>
      <label class="f">Contact du recruteur<input type="text" name="contact" value="${esc(d.contact||"")}" placeholder="Prénom Nom — téléphone"></label>
    </div>
    <button class="submit">${first?"Enregistrer et découvrir les profils":"Enregistrer les modifications"}</button>
  </form>`;
  if(!first)app.insertAdjacentHTML("beforeend",`<section class="rgpd">
    <h2>Mes données</h2>
    <p class="small">Tu peux récupérer l'ensemble de tes données ou supprimer définitivement ton compte. La suppression efface le profil, les décisions, les matchs et les messages, sans copie de sauvegarde.</p>
    <div class="toolrow"><button class="ghost" id="exp">Exporter mes données</button><button class="danger" id="del">Supprimer mon compte</button></div></section>`);
  wireChips();wireSliders();
  document.getElementById("f").onsubmit=onSave;
  document.getElementById("exp")?.addEventListener("click",exportData);
  document.getElementById("del")?.addEventListener("click",deleteAccount);
}
function wireChips(){
  app.querySelectorAll(".chip").forEach(c=>c.onclick=()=>c.setAttribute("aria-pressed",c.getAttribute("aria-pressed")!=="true"));
  app.querySelectorAll(".addchip").forEach(a=>{
    const inp=a.querySelector("input"),g=a.previousElementSibling;
    const add=()=>{const v=inp.value.trim();if(!v)return;
      if([...g.querySelectorAll(".chip")].some(c=>c.dataset.s.toLowerCase()===v.toLowerCase())){inp.value="";return}
      const b=document.createElement("button");b.type="button";b.className="chip";b.dataset.s=v;b.textContent=v;b.setAttribute("aria-pressed","true");
      b.onclick=()=>b.setAttribute("aria-pressed",b.getAttribute("aria-pressed")!=="true");g.appendChild(b);inp.value=""};
    a.querySelector("button").onclick=add;
    inp.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();add()}});
  });
}
function wireSliders(){
  app.querySelectorAll('.sliders input[type="range"]').forEach(r=>{
    const out=document.getElementById("o_"+r.id);
    r.addEventListener("input",()=>{if(out)out.textContent=r.value});
  });
}
function readGroups(){
  const o={};
  app.querySelectorAll(".chips").forEach(g=>o[g.dataset.g]=[...g.querySelectorAll('.chip[aria-pressed="true"]')].map(c=>c.dataset.s));
  app.querySelectorAll(".sliders").forEach(g=>{const v={};g.querySelectorAll('input[type="range"]').forEach(r=>v[r.dataset.k]=Number(r.value));o[g.dataset.g]=v});
  return o}

async function onSave(e){
  e.preventDefault();if(busy)return;busy=true;
  const btn=e.target.querySelector(".submit");btn.disabled=true;
  try{
    const f=Object.fromEntries(new FormData(e.target)),g=readGroups();
    if(me.role==="cand"){
      const pub={id:me.id,metier:f.metier,exp:Number(f.exp)||0,ville:f.ville,mobilite:Number(f.mobilite)||0,contrat:f.contrat,
        savoirs:g.savoirs,sf:g.sf,se:g.se,moteurs:g.moteurs,fierte:f.fierte,bienfait:f.bienfait,updated_at:new Date().toISOString()};
      let r=await sb.from("cand_public").upsert(pub);if(r.error)throw r.error;
      r=await sb.from("cand_private").upsert({id:me.id,nom:f.nom||null,age:f.age?Number(f.age):null,tel:f.tel||null});if(r.error)throw r.error;
    }else{
      const row={owner:me.id,ent:f.ent,taille:f.taille,ville:f.ville,poste:f.poste,contrat:f.contrat,salaire:f.salaire,
        savoirs:g.savoirs,sf:g.sf,se:g.se,moteurs:g.moteurs,valeurs:f.valeurs,plus:f.plus,updated_at:new Date().toISOString()};
      let id=myOffer?.id;
      if(id){const r=await sb.from("offers").update(row).eq("id",id);if(r.error)throw r.error}
      else{const r=await sb.from("offers").insert(row).select("id").single();if(r.error)throw r.error;id=r.data.id}
      const r2=await sb.from("offer_private").upsert({offer_id:id,contact:f.contact||null});if(r2.error)throw r2.error;
    }
    view="deck";toast("Enregistré.");await refresh();
  }catch(err){toast(err.message||"Enregistrement impossible.")}
  finally{busy=false;btn.disabled=false}
}

/* ===================== Découvrir ===================== */
let DECK=[];
async function deck(){
  app.innerHTML=`<p class="lead" style="padding:20px 0">Chargement…</p>`;
  try{
    if(me.role==="cand"){
      const [{data:offers,error:e1},{data:dec}]=await Promise.all([
        sb.from("offers").select("*").eq("active",true),
        sb.from("decisions").select("offer_id").eq("actor",me.id)]);
      if(e1)throw e1;
      const vus=new Set((dec||[]).map(d=>d.offer_id));
      DECK=(offers||[]).filter(o=>!vus.has(o.id)).map(o=>({o,s:fit(mine,o).total})).sort((a,b)=>b.s-a.s).map(x=>x.o);
    }else{
      const [{data:cands,error:e1},{data:dec}]=await Promise.all([
        sb.from("cand_public").select("*").eq("active",true).neq("id",me.id),
        sb.from("decisions").select("cand_id").eq("actor",me.id)]);
      if(e1)throw e1;
      const vus=new Set((dec||[]).map(d=>d.cand_id));
      DECK=(cands||[]).filter(c=>!vus.has(c.id)).map(c=>({c,s:fit(c,myOffer).total})).sort((a,b)=>b.s-a.s).map(x=>x.c);
    }
  }catch(err){app.innerHTML=`<div class="empty"><h2>Chargement impossible</h2><p>${esc(err.message||"")}</p></div>`;return}
  drawDeck();
}
function fitBox(d,label){
  const rows=[["savoirs","Savoirs","var(--dim1)"],["sf","Savoir-faire","var(--dim2)"],["se","Savoir-être","var(--dim3)"],["moteurs","Attentes","var(--sawdust)"]];
  return `<div class="fitbox">${rows.map(([k,n,c])=>d[k]===null?"":`<div class="frow" style="--dim:${c}"><span>${n}</span><div class="gauge"><i style="width:${d[k]}%"></i></div><span>${d[k]} %</span></div>`).join("")}
  <div class="tot"><span>${label}</span><span>${d.total} %</span></div></div>`}
function tagList(list,want){const w=new Set(want||[]);return (list||[]).map(s=>`<span class="tag ${w.has(s)?"hit":""}">${esc(s)}</span>`).join("")||'<span class="small">—</span>'}
function barList(defs,vals,ref){
  return `<div class="bars">${defs.map(([k,label])=>{const v=Number(vals?.[k]||0);const r=ref?Number(ref[k]||0):null;
    return `<div class="bar"><span>${esc(label)}</span><div class="bt"><i style="width:${v*10}%"></i>${r!==null?`<u style="left:${r*10}%"></u>`:""}</div><b>${v}</b></div>`}).join("")}</div>`}

function cardCand(c,off){
  const d=fit(c,off);
  return `<article class="card top" data-id="${c.id}">
    <span class="stamp yes">Intéressé</span><span class="stamp no">Passer</span>
    <div class="code">Profil ${code(c.id)}</div>
    <h2>${esc(c.metier)}</h2>
    <div class="meta"><span>${esc(c.exp)} ans de métier</span><span>${esc(c.ville||"")}${c.mobilite?" + "+esc(c.mobilite)+" km":""}</span><span>${esc(c.contrat||"")}</span></div>
    ${fitBox(d,"Compatibilité avec ton offre")}
    ${DIMS.map(([k,n,col])=>`<h3 style="--dim:${col}">${n}</h3><div>${tagList(c[k],off[k])}</div>`).join("")}
    <h3 style="--dim:var(--dim3)">Savoir-être <span class="small">(le trait marque ton attente)</span></h3>${barList(SE,c.se,off.se)}
    <h3 style="--dim:var(--sawdust)">Ce qui le fait avancer</h3>${barList(MOT,c.moteurs,off.moteurs)}
    ${c.fierte?`<h3 style="--dim:var(--sawdust)">Sa fierté</h3><p class="quote">${esc(c.fierte)}</p>`:""}
    ${c.bienfait?`<h3 style="--dim:var(--sawdust)">Le travail bien fait, pour lui</h3><p class="quote">${esc(c.bienfait)}</p>`:""}
    <div class="masked">${lockIcon()}<span>Nom, âge et coordonnées restent sur le serveur, hors de portée, jusqu'au match.</span></div>
  </article>`}
function cardOffer(o,c){
  const d=fit(c,o);
  return `<article class="card top" data-id="${o.id}">
    <span class="stamp yes">Intéressé</span><span class="stamp no">Passer</span>
    <div class="code">${esc(o.ent)}${o.taille?", "+esc(o.taille):""}</div>
    <h2>${esc(o.poste)}</h2>
    <div class="meta"><span>${esc(o.ville||"")}</span><span>${esc(o.contrat||"")}</span><span>${esc(o.salaire||"")}</span></div>
    ${fitBox(d,"Ton profil couvre")}
    ${DIMS.map(([k,n,col])=>`<h3 style="--dim:${col}">${n} attendus</h3><div>${tagList(o[k],c[k])}</div>`).join("")}
    <h3 style="--dim:var(--dim3)">Savoir-être recherchés <span class="small">(le trait marque ton niveau)</span></h3>${barList(SE,o.se,c.se)}
    <h3 style="--dim:var(--sawdust)">Ce que le poste offre</h3>${barList(MOT,o.moteurs,c.moteurs)}
    ${o.valeurs?`<h3 style="--dim:var(--sawdust)">Le travail bien fait, chez eux</h3><p class="quote">${esc(o.valeurs)}</p>`:""}
    ${o.plus?`<h3 style="--dim:var(--sawdust)">Ce qu'ils offrent</h3><p class="quote">${esc(o.plus)}</p>`:""}
    <div class="masked">${lockIcon()}<span>Ils ne verront ton nom et ton âge qu'en cas de match.</span></div>
  </article>`}

function drawDeck(){
  if(!DECK.length){
    app.innerHTML=`<div class="empty"><h2>Rien de nouveau</h2><p>Tu as parcouru tout ce qui est disponible. Repasse plus tard : de nouveaux ${me.role==="cand"?"postes":"profils"} arrivent au fil des inscriptions.</p><button class="ghost" id="rl">Recharger</button></div>`;
    document.getElementById("rl").onclick=deck;return}
  const top=DECK[0],next=DECK[1];
  const mk=x=>me.role==="cand"?cardOffer(x,mine):cardCand(x,myOffer);
  app.innerHTML=`<p class="lead" style="margin:4px 0 8px">${DECK.length} ${me.role==="cand"?"offre":"profil"}${DECK.length>1?"s":""} à découvrir</p>
  <div class="deck">${next?mk(next).replace('class="card top"','class="card under" aria-hidden="true"'):""}${mk(top)}</div>
  <div class="actions"><button class="act" id="no">Passer</button><button class="act yes" id="yes">Intéressé</button></div>
  <p class="hint">Glisse la carte ou utilise les flèches du clavier.</p>`;
  const card=app.querySelector(".card.top"),yes=card.querySelector(".stamp.yes"),no=card.querySelector(".stamp.no");
  let x0=null,dx=0;
  card.addEventListener("pointerdown",e=>{x0=e.clientX;dx=0;card.setPointerCapture(e.pointerId)});
  card.addEventListener("pointermove",e=>{if(x0===null)return;dx=e.clientX-x0;card.style.transform=`translateX(${dx}px) rotate(${dx/22}deg)`;
    yes.style.opacity=Math.max(0,Math.min(1,dx/90));no.style.opacity=Math.max(0,Math.min(1,-dx/90))});
  const end=()=>{if(x0===null)return;x0=null;
    if(Math.abs(dx)>100)fling(card,top,dx>0);
    else{card.classList.add("fly");card.style.transform="";yes.style.opacity=0;no.style.opacity=0;setTimeout(()=>card.classList.remove("fly"),350)}};
  card.addEventListener("pointerup",end);card.addEventListener("pointercancel",end);
  document.getElementById("yes").onclick=()=>fling(card,top,true);
  document.getElementById("no").onclick=()=>fling(card,top,false);
}
function fling(card,item,like){
  card.classList.add("fly");card.style.transform=`translateX(${like?600:-600}px) rotate(${like?25:-25}deg)`;card.style.opacity=0;
  setTimeout(()=>decide(item,like),240);
}
async function decide(item,like){
  DECK=DECK.slice(1);drawDeck();
  const candId=me.role==="cand"?me.id:item.id;
  const offerId=me.role==="cand"?item.id:myOffer.id;
  const {error}=await sb.from("decisions").insert({actor:me.id,cand_id:candId,offer_id:offerId,liked:like});
  if(error)return toast(error.message);
  if(!like)return;
  const {data}=await sb.from("matches").select("id").eq("cand_id",candId).eq("offer_id",offerId).maybeSingle();
  if(data)showMatch(item);
}
function showMatch(x){
  const isC=me.role==="cand";
  const m=document.createElement("div");m.className="modal";m.setAttribute("role","dialog");m.setAttribute("aria-modal","true");
  m.innerHTML=`<div class="box">${jointSvg("fit")}<h2>Ça s'emboîte</h2>
  <p>${isC?`${esc(x.ent)} s'intéresse aussi à ton profil. Ton nom leur est maintenant transmis.`:`Le profil ${code(x.id)} est intéressé par ton offre. Son identité est maintenant visible.`}</p>
  <button class="submit" id="see" style="width:100%">Voir le match</button>
  <button class="linkbtn" id="cont" style="margin-top:8px">Continuer à découvrir</button></div>`;
  document.body.appendChild(m);
  m.querySelector("#see").onclick=()=>{m.remove();view="matches";render()};
  m.querySelector("#cont").onclick=()=>m.remove();
  m.querySelector("#see").focus();
}

/* ===================== Matchs et messages ===================== */
async function matches(){
  app.innerHTML=`<p class="lead" style="padding:20px 0">Chargement…</p>`;
  const {data:ms,error}=await sb.from("matches").select("*").order("created_at",{ascending:false});
  if(error)return app.innerHTML=`<div class="empty"><h2>Chargement impossible</h2><p>${esc(error.message)}</p></div>`;
  if(!ms||!ms.length){
    app.innerHTML=`<div class="empty"><h2>Pas encore de match</h2><p>Un match apparaît quand l'intérêt est réciproque. Continue à découvrir ${me.role==="cand"?"les offres":"les profils"}.</p><button class="ghost" id="go">Découvrir</button></div>`;
    document.getElementById("go").onclick=()=>{view="deck";render()};return}
  const ids=ms.map(m=>m.id);
  const {data:msgs}=await sb.from("messages").select("*").in("match_id",ids).order("created_at");
  let heads={};
  if(me.role==="cand"){
    const oids=[...new Set(ms.map(m=>m.offer_id))];
    const [{data:offs},{data:cts}]=await Promise.all([
      sb.from("offers").select("*").in("id",oids),
      sb.from("offer_private").select("*").in("offer_id",oids)]);
    const byId=Object.fromEntries((offs||[]).map(o=>[o.id,o]));
    const ct=Object.fromEntries((cts||[]).map(c=>[c.offer_id,c.contact]));
    ms.forEach(m=>{const o=byId[m.offer_id]||{};
      heads[m.id]=`<h3>${esc(o.poste||"Offre")}</h3><div class="small">${esc(o.ent||"")}${o.ville?", "+esc(o.ville):""}${o.contrat?", "+esc(o.contrat):""}</div>
      <div class="reveal"><b>Contact</b><span>${esc(ct[m.offer_id]||"non renseigné")}</span></div>`});
  }else{
    const cids=[...new Set(ms.map(m=>m.cand_id))];
    const [{data:pubs},{data:privs}]=await Promise.all([
      sb.from("cand_public").select("*").in("id",cids),
      sb.from("cand_private").select("*").in("id",cids)]);
    const byId=Object.fromEntries((pubs||[]).map(c=>[c.id,c]));
    const pv=Object.fromEntries((privs||[]).map(c=>[c.id,c]));
    ms.forEach(m=>{const c=byId[m.cand_id]||{},p=pv[m.cand_id]||{};
      heads[m.id]=`<h3>${esc(c.metier||"Profil")}</h3><div class="small">Profil ${code(m.cand_id)}, ${esc(c.exp??"?")} ans de métier</div>
      <div class="reveal"><b>${esc(p.nom||"Nom non renseigné")}${p.age?", "+esc(p.age)+" ans":""}</b><span>${esc(p.tel||"contact non renseigné")}</span></div>`});
  }
  app.innerHTML=`<h1 class="pagetitle">Mes matchs</h1><p class="lead">L'intérêt est réciproque : les identités sont dévoilées des deux côtés.</p>`+
  ms.map(m=>{const th=(msgs||[]).filter(x=>x.match_id===m.id);
    return `<div class="match" data-id="${m.id}">${heads[m.id]||""}
      <div class="thread">${th.map(x=>`<div class="msg ${x.sender===me.id?"me":"them"}">${esc(x.body)}</div>`).join("")}</div>
      <form class="msgform"><input type="text" placeholder="Écrire un message…" aria-label="Message" maxlength="1000"><button>Envoyer</button></form>
    </div>`}).join("")+`<div class="toolrow"><button class="ghost" id="rl">Rafraîchir</button></div>`;
  document.getElementById("rl").onclick=matches;
  app.querySelectorAll(".match").forEach(el=>{
    el.querySelector(".msgform").onsubmit=async e=>{
      e.preventDefault();const inp=e.target.querySelector("input"),t=inp.value.trim();if(!t)return;
      inp.value="";
      const {error}=await sb.from("messages").insert({match_id:Number(el.dataset.id),sender:me.id,body:t});
      if(error)return toast(error.message);
      el.querySelector(".thread").insertAdjacentHTML("beforeend",`<div class="msg me">${esc(t)}</div>`);
    };
  });
}

/* ===================== RGPD ===================== */
async function exportData(){
  const out={compte:{email:session.user.email,role:me.role,consentement:me.consent_at,cree_le:me.created_at}};
  if(me.role==="cand"){
    const [{data:a},{data:b}]=await Promise.all([
      sb.from("cand_public").select("*").eq("id",me.id),sb.from("cand_private").select("*").eq("id",me.id)]);
    out.profil_public=a;out.profil_prive=b;
  }else{
    const [{data:a},{data:b}]=await Promise.all([
      sb.from("offers").select("*").eq("owner",me.id),sb.from("offer_private").select("*")]);
    out.offres=a;out.contacts=b;
  }
  const [{data:d},{data:m},{data:msg}]=await Promise.all([
    sb.from("decisions").select("*"),sb.from("matches").select("*"),sb.from("messages").select("*")]);
  out.decisions=d;out.matchs=m;out.messages=msg;
  const blob=new Blob([JSON.stringify(out,null,2)],{type:"application/json"});
  const u=URL.createObjectURL(blob),a2=document.createElement("a");
  a2.href=u;a2.download="matchwork-mes-donnees.json";a2.click();URL.revokeObjectURL(u);
}
async function deleteAccount(){
  if(!confirm("Supprimer définitivement ton compte, ton profil, tes décisions, tes matchs et tes messages ? Cette action est irréversible."))return;
  if(!confirm("Dernière confirmation : tout sera effacé immédiatement."))return;
  const {error}=await sb.rpc("delete_my_account");
  if(error)return toast(error.message);
  await sb.auth.signOut();
  toast("Compte supprimé. Toutes tes données ont été effacées.");
  view="landing";
}

/* ===================== Divers ===================== */
tabs.querySelectorAll("button").forEach(b=>b.onclick=()=>{view=b.dataset.v;render();scrollTo(0,0)});
document.getElementById("logo").onclick=()=>{view=session?"deck":"landing";render()};
lo.onclick=async()=>{await sb.auth.signOut();view="landing";render()};
document.addEventListener("keydown",e=>{
  if(view!=="deck"||document.querySelector(".modal")||/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName||""))return;
  if(e.key==="ArrowRight")document.getElementById("yes")?.click();
  if(e.key==="ArrowLeft")document.getElementById("no")?.click();
});
boot();
